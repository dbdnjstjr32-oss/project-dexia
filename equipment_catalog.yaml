# Dexia — Equipment Catalog (AIP data spine).
#
# The data-driven capability ontology. Every platform (blue + red) is ONE entry.
# A single entry drives five subsystems, so adding a new weapon/sensor is a data
# edit — not code:
#   sensors[]   -> feed observation models (what it sees, at what precision)
#   emits       -> fusion detectability (can SIGINT pick it up)
#   effects[]   -> AssetMatch feasibility + sim effect resolution
#   commands[]  -> ActionTypes it accepts (auto-surfaced to the LLM as tools)
#   constraints -> ammo / cooldown / readiness
#
# category vocabulary (abstract classification matched by sensors.detects and
# effect suitability): armor | apc | infantry | artillery | air_defense | ew |
# emitter | air | sea | structure
#
# ranges in metres, times in seconds. This starter set spans land/air/EW across
# theaters; extend freely — the loader is tolerant and every field has a default.

# ============================ BLUE (friendly) ============================== #
m777_howitzer:
  side: blue
  domain: land
  role: fires
  effects:
    - {type: indirect_fire, range_m: 30000, min_range_m: 4000, lethal_r: 70, tof_s: 40}
  commands: [request_fires]
  constraints: {ammo: true, cooldown_s: 20, shoot_and_scoot: true}

m142_himars:
  side: blue
  domain: land
  role: fires
  effects:
    - {type: indirect_fire, range_m: 70000, min_range_m: 15000, lethal_r: 80, tof_s: 90}
  commands: [request_fires]
  constraints: {ammo: true, cooldown_s: 60, shoot_and_scoot: true}

tb2_recon_uav:
  side: blue
  domain: air
  role: isr
  sensors:
    - {type: eo_ir, range_m: 8000, fov_deg: 30, pos_noise_m: 5, detects: [armor, apc, infantry, artillery, air_defense, structure]}
  commands: [task_isr, move, recall]
  constraints: {endurance_s: 7200}

switchblade:
  side: blue
  domain: air
  role: strike
  sensors:
    - {type: eo_ir, range_m: 3000, fov_deg: 40, pos_noise_m: 8, detects: [armor, apc, infantry]}
  effects:
    - {type: loiter_strike, range_m: 10000, lethal_r: 15, tof_s: 30}
  commands: [engage, move, recall]
  constraints: {ammo: true, one_shot: true}

ew_jammer_gnd:
  side: blue
  domain: land
  role: ew
  effects:
    - {type: jam, range_m: 20000, degrades: radar}
  commands: [jam]
  constraints: {cooldown_s: 10}

ugs_field:
  side: blue
  domain: land
  role: sensor
  sensors:
    - {type: acoustic, range_m: 1500, fov_deg: 360, pos_noise_m: 20, detects: [armor, apc, infantry]}
  commands: []
  constraints: {static: true}

gsr_radar:                       # ground-surveillance radar (P4): sees ground armor
  side: blue                     # past a ridge where EO is occluded (terrain_occludes: false)
  domain: land
  role: sensor
  sensors:
    - {type: radar, range_m: 25000, fov_deg: 360, pos_noise_m: 25, terrain_occludes: false, detects: [armor, apc]}
  commands: []
  constraints: {static: true, emits_warning: true}

recon_drone:                    # legacy Dexia recon quad (DroneObject-backed)
  side: blue
  domain: air
  role: isr
  sensors:
    - {type: eo_ir, range_m: 5000, fov_deg: 60, pos_noise_m: 6, detects: [armor, apc, air_defense]}
  commands: [deploy, task_isr, move, recall]

kami_drone:                     # legacy Dexia loitering munition (DroneObject-backed)
  side: blue
  domain: air
  role: strike
  effects:
    - {type: loiter_strike, range_m: 6000, lethal_r: 10, tof_s: 20}
  commands: [deploy, engage, move, recall]
  constraints: {ammo: true, one_shot: true, killchain_mac: true}

