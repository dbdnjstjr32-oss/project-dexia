# Dexia scenario — 3D terrain demo (tier B / P3).
#
# Opt-in to the 3D physics path via the `terrain:` block below: a ridge sits
# between the red start (x~6000) and the hold line, so the advancing T-72/BMP
# column drives itself OVER the grade — z hugs the surface, it pitches up and
# slows climbing, gains descending — instead of teleporting in a straight 2D line.
# The TB2 (domain: air) self-navigates in 3D (banks to its waypoints, holds a
# cruise altitude above the terrain). Lives in scenarios/ root (NOT generated/),
# so it is excluded from the campaign eval set and changes no regression numbers.
#
# Demonstrates P3's completion criterion; validates against equipment_catalog.yaml.

scenario:
  id: ridge-assault-3d
  theater: eastern_europe

  # --- 3D heightfield (presence of this block enables physics) -------------- #
  terrain:
    type: hill            # flat | ramp | hill
    peak: 350             # ridge height (m)
    center: [3000, 0]     # crest between red start and the line
    sigma: 1000           # spread (m)
    size: 201             # grid samples per axis
    dx: 50                # grid spacing (m)  -> covers x,y in [-2000, 8000]/[-5000, 5000]
    origin: [-2000, -5000]

  mission:
    tasking: "능선을 넘어 진격하는 적 기갑대대를 저지선에서 막아라. 아군 손실 최소화."
    intent: delay
    roe: [no_civilian_area]
    victory:
      hold_line: [2500, 0]
      max_blue_loss: 2
      time_limit_s: 600

  blue:
    - {cls: m777_howitzer, n: 2, pos: [-1000, 0]}
    - {cls: tb2_recon_uav, n: 1, behavior: advance, route: [[-1500, 0], [1500, 0]], hero: true}
    - {cls: switchblade,   n: 4, pos: [-1200, 0]}
    - {cls: ew_jammer_gnd, n: 1, pos: [-900, 0]}
    - {cls: ugs_field,     n: 3, pos: [800, 0]}

  red:
    - {cls: t72_tank,    n: 6, behavior: advance, route: [[6000, 0],   [2000, 0]]}
    - {cls: bmp_apc,     n: 3, behavior: advance, route: [[6200, 300], [2200, 300]]}
    - {cls: sa11_sam,    n: 1, pos: [7000, 2000], behavior: static_ad}
    - {cls: krasukha_ew, n: 1, pos: [5500, 0],    behavior: periodic_jam}

  feeds: [sigint, ugs, uav_eo]
