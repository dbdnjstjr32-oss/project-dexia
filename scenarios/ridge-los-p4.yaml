# Dexia scenario — P4 LOS / ballistics verification (tier B).
#
# A 350 m ridge at x~3000 splits the field. A red tank sits IN FRONT of the ridge
# (EO sees it) and another BEHIND it (EO is occluded — but the ground-search radar,
# terrain_occludes: false, still detects it). The howitzer lobs a ballistic arc
# OVER the ridge onto the hidden tank. Demonstrates raycast LOS, 3D detection, and
# the 3D weapon arc. SAM 3-check + PN intercept are exercised directly in the test.

scenario:
  id: ridge-los-p4
  theater: eastern_europe

  terrain:
    type: hill
    peak: 350
    center: [3000, 0]
    sigma: 1000
    size: 201
    dx: 50
    origin: [-2000, -5000]

  mission:
    tasking: "능선 뒤에 은폐한 적 기갑을 레이더로 탐지하고 곡사화력으로 제압하라."
    intent: destroy
    roe: [no_civilian_area]
    victory:
      hold_line: [0, 0]
      max_blue_loss: 1
      time_limit_s: 600

  blue:
    - {cls: m777_howitzer, n: 1, pos: [-1000, 0]}
    - {cls: tb2_recon_uav, n: 1, pos: [0, 0]}      # EO, sits low here -> ridge occludes it
    - {cls: gsr_radar,     n: 1, pos: [0, 0]}      # radar sees past the ridge
    - {cls: switchblade,   n: 2, pos: [-800, 0]}

  red:
    - {cls: t72_tank, n: 1, pos: [2000, 0]}        # in front of the ridge: EO sees it (armor)
    - {cls: bmp_apc,  n: 1, pos: [4500, 0]}        # behind the ridge: EO blind, radar sees (apc)

  feeds: [sigint, ugs, uav_eo, gsr]
