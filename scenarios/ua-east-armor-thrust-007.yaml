# Dexia scenario — Eastern Europe / armored thrust under SAM + EW cover.
#
# Seed scenario (hand-authored). The AI must collect (SIGINT cue -> ISR confirm),
# fuse, then operate the right asset (jam the SAM, mass fires on the column,
# finish with loitering munitions) to hold the line. Validates against
# equipment_catalog.yaml. See DESIGN_AIP.md sections 3 & 7.2.

scenario:
  id: ua-east-armor-thrust-007
  theater: eastern_europe
  mission:
    tasking: "동측에서 진격하는 적 기갑대대를 저지선까지 막아라. 아군 손실을 최소화하고 부수피해를 회피하라."
    intent: delay                 # deny | destroy | delay | recon | seize
    roe: [no_civilian_area]
    victory:
      hold_line: [4200, 0]        # red must not cross this x-line
      max_blue_loss: 2
      time_limit_s: 600

  blue:
    - {cls: m777_howitzer, n: 2, pos: [-1000, 0]}
    - {cls: tb2_recon_uav, n: 1, pos: [-1500, 0]}
    - {cls: switchblade,   n: 4, pos: [-1200, 0]}
    - {cls: ew_jammer_gnd, n: 1, pos: [-900, 0]}
    - {cls: ugs_field,     n: 3, pos: [800, 0]}

  red:
    - {cls: t72_tank,    n: 8, behavior: advance, route: [[6000, 0], [3000, 0]]}
    - {cls: bmp_apc,     n: 4, behavior: advance, route: [[6200, 300], [3200, 300]]}
    - {cls: sa11_sam,    n: 1, pos: [7000, 2000], behavior: static_ad}
    - {cls: krasukha_ew, n: 1, pos: [5500, 0],    behavior: periodic_jam}

  feeds: [sigint, ugs, uav_eo]
